# Encabezados comunes. Nginx no hereda add_header en un bloque que define los
# suyos, por eso este archivo se incluye en cada uno.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Los mosaicos de OpenStreetMap exigen recibir el origen en Referer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
