server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API valida 5 MB con un mensaje claro y corta a los 10 MB; Nginx deja
    # pasar un poco más para que el usuario reciba ese mensaje y no un error 413 genérico.
    client_max_body_size 11m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/seguridad.conf;

    # DNS interno de Docker: con la variable, Nginx vuelve a resolver "api" si
    # el contenedor se reinicia y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_destino http://api:3000;
        proxy_pass $api_destino;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generar un rol o consultar OSRM puede tardar más que una petición normal.
        proxy_read_timeout 120s;
    }

    # Vite pone un hash en el nombre: si cambia el archivo, cambia la URL.
    location /assets/ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html siempre se revalida para tomar la versión nueva del sistema.
    location = /index.html {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:ico|png|jpe?g|svg|webp|woff2?)$ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Rutas de React (/roles, /monitoreo...): las resuelve el navegador.
    location / {
        try_files $uri /index.html;
    }
}
